# Полный прогон тестов бота + P1-ретест на каждый push/PR в main.
# Деплой Railway (deploy-railway.yml) дополнительно гоняет golden-пороги перед выкладкой.
name: Bot tests

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/bot-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/bot-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: pytest (full + P1 retest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r bot/requirements.txt

      - name: P1 manual retest (automated)
        run: python -m pytest -q bot/tests/test_p1_manual_retest.py -m p1_retest

      - name: Full bot test suite
        run: python -m pytest -q bot/tests/
