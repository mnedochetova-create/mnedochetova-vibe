# Деплой Telegram-бота на Railway после успешных тестов.
#
# Требуется секрет репозитория (Settings → Secrets and variables → Actions):
#   RAILWAY_TOKEN — Project Token: Railway → Project → Settings → Tokens
#
# Имя сервиса по умолчанию: mnedochetova-vibe (см. bot/RAILWAY_PROJECT.md).
# Переопределение: repository variable RAILWAY_SERVICE_NAME (не секрет).
#
# Важно: если в Railway уже включён деплой «из GitHub» для этого репозитория, отключите его
# для этого сервиса — иначе на каждый push будут запускаться две параллельные сборки.
name: Deploy bot (Railway)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (parsing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r bot/requirements.txt

      - name: Pytest
        run: python -m pytest -q bot/tests/test_brief_parsing.py

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Upload and deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Добавьте секрет RAILWAY_TOKEN (см. комментарий в начале workflow и bot/RAILWAY_PROJECT.md)."
            exit 1
          fi
          SERVICE_NAME="${RAILWAY_SERVICE_NAME:-mnedochetova-vibe}"
          railway up --ci --service "${SERVICE_NAME}"
